[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-stats"
version = "0.1.0"
description = "Render discord-message-scraper's rollups as a local stats dashboard."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["discord", "sqlite", "dashboard", "statistics", "self-hosted"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Chat",
  "Topic :: Database :: Front-Ends",
]

# The tool stays dependency-free; this dashboard is where FastAPI and friends
# live, so they sit in the `web` extra the entrypoint and the README install.
dependencies = []

[project.urls]
Documentation = "https://github.com/BobbyNooby/discord-message-stats#readme"
Source = "https://github.com/BobbyNooby/discord-message-stats"

[project.optional-dependencies]
web = ["fastapi", "uvicorn[standard]", "httpx", "itsdangerous", "apscheduler", "python-multipart", "authlib"]
dev = ["pytest"]

[project.scripts]
discord-stats = "discord_stats.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
